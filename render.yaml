services:
  - type: web
    name: speakfill
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python download_fonts.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
